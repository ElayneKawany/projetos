# ============================================================
# MegaG PMO — CI Pipeline
#
# Executa em cada push e pull_request.
# Etapas: TypeScript → ESLint → Testes → Build
#
# IMPORTANTE: JWT_SECRET precisa existir (não-vazio) para que
# lib/config/env.ts não lance erro durante next build e testes.
# O valor aqui é um placeholder de build — não é usado em runtime.
# ============================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: TypeScript · ESLint · Testes · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check data_fim_prev usage
        run: npm run check:data-fim-prev

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test
        env:
          JWT_SECRET: ci-build-placeholder-not-used-at-runtime

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-build-placeholder-not-used-at-runtime
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .next/
            *.log
          retention-days: 7
