          description: Filtrar pelo tipo do lançamento
        - in: query
          name: status
          schema: { type: string }
          description: Filtrar pelo status
      responses:
        '200':
          description: Lista de lançamentos financeiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  lancamentos:
                    type: array
                    items: { $ref: '#/components/schemas/LancamentoFinanceiro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  # ── Configurações financeiras ──────────────────────────────────────────────
  /api/configuracoes/financeiro:
    patch:
      operationId: atualizarConfiguracaoFinanceira
      summary: Atualizar premissa financeira global (SELIC, taxa de desconto, inflação)
      description: >
        Atualiza uma das três premissas financeiras globais utilizadas nos
        cálculos de VPL, TIR e ROI. Somente as chaves `selic`, `taxa_desconto`
        e `inflacao` são aceitas. Registra auditoria com valores anterior e
        posterior. Perfil mínimo: PMO.
      tags: [Configurações]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chave, valor]
              properties:
                chave:
                  type: string
                  enum: [selic, taxa_desconto, inflacao]
                  description: Nome da premissa a atualizar
                valor:
                  description: Valor percentual da premissa (armazenado como string)
                  example: 10.75
            example:
              chave: selic
              valor: 10.75
      responses:
        '200':
          description: Premissa atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '400':
          description: Chave inválida ou valor ausente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  # ── Financeiro do projeto ──────────────────────────────────────────────────
  /api/projetos/{id}/financeiro:
    parameters:
      - $ref: '#/components/parameters/projetoId'

    get:
      operationId: dashboardFinanceiroProjeto
      summary: Dashboard financeiro do projeto
      description: >
        Retorna contratos completos (com pagamentos), resumo de totais
        CAPEX/OPEX, e indicadores da viabilidade financeira aprovada.
        Equivalente a `GET /contratos` — ambos os endpoints retornam os mesmos
        dados.
      tags: [Financeiro]
      responses:
        '200':
          description: Dashboard financeiro do projeto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardFinanceiro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

    post:
      operationId: criarLancamentoFinanceiro
      summary: Criar lançamento financeiro avulso no projeto
      description: >
        Cria um lançamento financeiro não vinculado a contrato. Aceita
        `application/json` ou `multipart/form-data` (quando há upload de nota
        fiscal). O arquivo é salvo em `public/uploads/financeiro/`.
        Permissão: `projetos:manage` (GESTOR ou superior).
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LancamentoFinanceiroInput' }
          multipart/form-data:
            schema:
              allOf:
                - { $ref: '#/components/schemas/LancamentoFinanceiroInput' }
                - type: object
                  properties:
                    arquivo_nf:
                      type: string
                      format: binary
                      description: Arquivo da nota fiscal
      responses:
        '200':
          description: Lançamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  # ── Movimentos financeiros ─────────────────────────────────────────────────
  /api/projetos/{id}/financeiro/movimentos:
    parameters:
      - $ref: '#/components/parameters/projetoId'

    get:
      operationId: listarMovimentosFinanceiros
      summary: Listar movimentos financeiros do projeto
      description: Retorna documentos/NFs registrados no projeto (modelo legacy de movimentos).
      tags: [Financeiro]
      responses:
        '200':
          description: Lista de movimentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  movimentos:
                    type: array
                    items: { $ref: '#/components/schemas/MovimentoFinanceiro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'

    post:
      operationId: criarMovimentoFinanceiro
      summary: Registrar movimento financeiro (documento/NF)
      description: >
        Cria um novo movimento financeiro (NF, contrato, comprovante, medição
        etc.) no projeto. Perfil mínimo: GESTOR.
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovimentoFinanceiroInput' }
      responses:
        '201':
          description: Movimento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

    patch:
      operationId: atualizarStatusMovimento
      summary: Aprovar, rejeitar ou cancelar movimento financeiro
      description: >
        Atualiza o status de um movimento existente. Somente movimentos com
        status `PENDENTE` podem ser alterados. Registra evento na timeline
        do projeto. Perfil mínimo: DIRETOR.
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movimentoId, status]
              properties:
                movimentoId: { type: integer }
                status:
                  type: string
                  enum: [PENDENTE, APROVADO, REJEITADO, CANCELADO]
                observacoes: { type: string, nullable: true }
            example:
              movimentoId: 45
              status: APROVADO
              observacoes: "NF conferida e aprovada."
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '400':
          description: Movimento não está em PENDENTE ou campos obrigatórios ausentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  # ── Contratos ──────────────────────────────────────────────────────────────
  /api/projetos/{id}/financeiro/contratos:
    parameters:
      - $ref: '#/components/parameters/projetoId'

    get:
      operationId: listarContratos
      summary: Listar contratos do projeto com resumo financeiro
      description: >
        Retorna os contratos com pagamentos, resumo de totais e indicadores de
        viabilidade. Equivalente a `GET /api/projetos/{id}/financeiro`.
      tags: [Financeiro]
      responses:
        '200':
          description: Contratos, resumo e viabilidade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardFinanceiro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'

    post:
      operationId: criarContrato
      summary: Criar contrato financeiro no projeto
      description: >
        Cria um novo contrato (fornecedor + valor aprovado + natureza CAPEX/OPEX).
        Perfil mínimo: GESTOR (`projetos:manage`).
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContratoInput' }
            example:
              contratado: "Accenture Brasil Ltda."
              valor_aprovado: 250000
              natureza_financeira: CAPEX
              numero_contrato: "CT-2026-007"
              tipo_contrato: SERVICO
              descricao_servico: "Consultoria de implementação SAP S/4HANA"
      responses:
        '201':
          description: Contrato criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /api/projetos/{id}/financeiro/contratos/exportar:
    parameters:
      - $ref: '#/components/parameters/projetoId'

    get:
      operationId: exportarContratosExcel
      summary: Exportar contratos e pagamentos como Excel
      description: >
        Gera e retorna um arquivo `.xlsx` com todos os contratos e seus
        pagamentos do projeto.
      tags: [Financeiro]
      responses:
        '200':
          description: Arquivo Excel dos contratos
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema: { type: string }
              example: 'attachment; filename="Financeiro_Projeto_42.xlsx"'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/projetos/{id}/financeiro/contratos/importar:
    parameters:
      - $ref: '#/components/parameters/projetoId'

    post:
      operationId: importarContratosExcel
      summary: Importar contratos em lote via Excel
      description: >
        Recebe um arquivo `.xlsx` ou `.xls`, parseia contratos e pagamentos e
        os persiste em transação. Em caso de erros fatais na planilha, retorna
        422 sem persistir nada.

        Colunas oficiais do template (ordem fixa):
        `Número Contrato | Contratado | Tipo Contrato | Descrição Serviço |
        Valor Aprovado | Número Documento | Tipo Documento | Nota Fiscal |
        Data Pagamento | Competência | Valor Pago | Observação`
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo .xlsx ou .xls no formato do template oficial
      responses:
        '200':
          description: Importação concluída com sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoImportacaoFinanceiro' }
        '400':
          description: Nenhum arquivo enviado ou extensão inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          description: Erros fatais na planilha ou nenhum contrato válido encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:          { type: boolean, example: false }
                  errosFatais: { type: array, items: { type: string } }
                  warnings:    { type: array, items: { type: string } }
                  mensagem:    { type: string, nullable: true }

  /api/projetos/{id}/financeiro/contratos/{contId}:
    parameters:
      - $ref: '#/components/parameters/projetoId'
      - $ref: '#/components/parameters/contId'

    patch:
      operationId: atualizarContrato
      summary: Atualizar dados de um contrato
      description: >
        Atualiza campos do contrato. Somente os campos enviados são alterados.
        Perfil mínimo: GESTOR (`projetos:manage`).
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContratoAtualizacao' }
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

    delete:
      operationId: desativarContrato
      summary: Desativar contrato (soft-delete)
      description: >
        Marca o contrato como inativo (`ativo = 0`). Os pagamentos associados
        permanecem no banco. Perfil mínimo: GESTOR (`projetos:manage`).
      tags: [Financeiro]
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ── Pagamentos ─────────────────────────────────────────────────────────────
  /api/projetos/{id}/financeiro/contratos/{contId}/pagamentos:
    parameters:
      - $ref: '#/components/parameters/projetoId'
      - $ref: '#/components/parameters/contId'

    post:
      operationId: criarPagamento
      summary: Registrar pagamento em um contrato
      description: >
        Lança um pagamento contra o contrato. Aceita `application/json` ou
        `multipart/form-data` (quando há upload de comprovante). O arquivo é
        salvo em `public/uploads/financeiro/{projeto_id}/`.

        `valor_pago` deve ser maior que zero.
        Perfil mínimo: GESTOR (`projetos:manage`).
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagamentoInput' }
            example:
              valor_pago: 50000
              numero_documento: "NF-2026-1234"
              tipo_documento: NF
              nota_fiscal: "12345"
              data_pagamento: "2026-08-01"
              competencia: "2026-08"
          multipart/form-data:
            schema:
              allOf:
                - { $ref: '#/components/schemas/PagamentoInput' }
                - type: object
                  properties:
                    arquivo:
                      type: string
                      format: binary
                      description: Comprovante de pagamento (qualquer extensão)
      responses:
        '201':
          description: Pagamento registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        '400':
          description: valor_pago ausente, <= 0, ou valor excede saldo do contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /api/projetos/{id}/financeiro/contratos/{contId}/pagamentos/{pagId}:
    parameters:
      - $ref: '#/components/parameters/projetoId'
      - $ref: '#/components/parameters/contId'
      - $ref: '#/components/parameters/pagId'

    patch:
      operationId: atualizarPagamento
      summary: Atualizar dados de um pagamento
      description: >
        Atualiza campos de um pagamento existente. Somente os campos enviados
        são alterados. Perfil mínimo: GESTOR (`projetos:manage`).
      tags: [Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagamentoAtualizacao' }
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

    delete:
      operationId: desativarPagamento
      summary: Desativar pagamento (soft-delete)
      description: >
        Marca o pagamento como inativo (`ativo = 0`).
        Perfil mínimo: GESTOR (`projetos:manage`).
      tags: [Financeiro]
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ── Orçamento ──────────────────────────────────────────────────────────────
  /api/projetos/{id}/orcamento:
    parameters:
      - $ref: '#/components/parameters/projetoId'

    get:
      operationId: listarOrcamento
      summary: Listar grupos e itens do orçamento do projeto
      description: >
        Retorna grupos de orçamento com seus itens aninhados e totais calculados
        (por tipo de investimento e natureza CAPEX/OPEX).
      tags: [Orçamento]
      responses:
        '200':
          description: Orçamento completo
          content:
            application/json:
              schema:
                type: object
                properties:
                  grupos:
                    type: array
                    items: { $ref: '#/components/schemas/GrupoOrcamento' }
                  totais: { $ref: '#/components/schemas/TotaisOrcamento' }
        '401':
          $ref: '#/components/responses/NaoAutenticado'

    post:
      operationId: criarGrupoOrcamento
      summary: Criar grupo de orçamento
      description: >
        Cria um novo grupo de orçamento no projeto. **Bloqueado** se o Estudo
        de Viabilidade mais recente estiver com status `APROVADO` (403 com
        mensagem orientando solicitar revisão).
        Perfil mínimo: GESTOR.
      tags: [Orçamento]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoOrcamentoInput' }
            example:
              tipo: CAPEX
              nome: "Hardware e Infraestrutura"
              ordem: 1
      responses:
        '201':
          description: Grupo criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Sem permissão ou orçamento bloqueado pelo Estudo de Viabilidade aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                error: "O orçamento está bloqueado. O Estudo de Viabilidade foi aprovado. Solicite uma revisão para editar."

  /api/projetos/{id}/orcamento/grupos/{grupoId}/itens:
    parameters:
      - $ref: '#/components/parameters/projetoId'
      - $ref: '#/components/parameters/grupoId'

    post:
      operationId: criarItemOrcamento
      summary: Criar item de orçamento dentro de um grupo
      description: >
        Adiciona um item ao grupo de orçamento. **Bloqueado** se o Estudo de
        Viabilidade mais recente estiver `APROVADO`.
        Perfil mínimo: GESTOR.
      tags: [Orçamento]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemOrcamentoInput' }
            example:
              nome: "Servidores Dell PowerEdge"
              valor_aprovado: 120000
              descricao: "3 servidores para ambiente de produção"
              ordem: 1
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Sem permissão ou orçamento bloqueado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

    patch:
      operationId: atualizarItemOrcamento
      summary: Atualizar item de orçamento
      description: >
        Atualiza os campos de um item existente. **Bloqueado** se o Estudo de
        Viabilidade mais recente estiver `APROVADO`.
        Perfil mínimo: GESTOR.
      tags: [Orçamento]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [itemId]
                  properties:
                    itemId: { type: integer, description: "ID do item a atualizar" }
                - { $ref: '#/components/schemas/ItemOrcamentoAtualizacao' }
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

    delete:
      operationId: deletarItemOuGrupo
      summary: Remover item de orçamento ou grupo inteiro
      description: >
        Se `itemId` for informado via query param, desativa o item.
        Se omitido, desativa o grupo `grupoId` inteiro.
        **Bloqueado** se o Estudo de Viabilidade mais recente estiver `APROVADO`.
        Perfil mínimo: PMO (GESTOR não pode deletar).
      tags: [Orçamento]
      parameters:
        - in: query
          name: itemId
          schema: { type: integer }
          description: "Se presente, desativa este item; se omitido, desativa o grupo"
      responses:
        '200':
          $ref: '#/components/responses/Sucesso'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
